<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>湊テック</title>
  <meta name="description" content="湊テックは、現場業務をシンプルにするアプリを開発しています。">
  <style>
    :root {
      --brand: #0F8B8D;
      --brand-dark: #086A6C;
      --brand-light: #E6F4F4;
      --text: #1B1C1C;
      --subtext: #5F6666;
      --border: #D9E2E2;
      --background: #FFFFFF;
      --surface: #F7F9F9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.7;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .container {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner {
      padding: 18px 0;
      font-weight: 700;
      font-size: 20px;
    }

    .hero {
      padding: 72px 0 56px;
    }

    .hero h1 {
      margin: 0 0 16px;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      font-size: 18px;
      color: var(--subtext);
    }

    .apps {
      padding: 24px 0 72px;
    }

    .apps h2 {
      margin-bottom: 24px;
      font-size: 26px;
    }

    .card {
      display: block;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--brand);
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--brand-light);
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .card p {
      margin: 0;
      color: var(--subtext);
    }

    .link-text {
      display: inline-block;
      margin-top: 18px;
      color: var(--brand-dark);
      font-weight: 700;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0 40px;
      color: var(--subtext);
      font-size: 14px;
    }

    footer a {
      color: var(--brand-dark);
    }
  </style>
</head>

<body>
  <header>
    <div class="container header-inner">
      湊テック
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>湊テック</h1>
        <p>現場業務をシンプルにするアプリを開発しています。</p>
      </div>
    </section>

    <section class="apps">
      <div class="container">
        <h2>提供アプリ</h2>

        <a class="card" href="./seisou-repo/">
          <span class="badge">清掃業向け</span>
          <h3>清掃レポ</h3>
          <p>清掃作業の報告書を、スマホでかんたんに。</p>
          <span class="link-text">清掃レポを見る →</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div>運営：湊テック</div>
      <div>
        お問い合わせ：
        <a href="mailto:minatotech.apps@gmail.com">minatotech.apps@gmail.com</a>
      </div>
      <div style="margin-top: 12px;">© 湊テック</div>
    </div>
  </footer>
</body>
</html>
